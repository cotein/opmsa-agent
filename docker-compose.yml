services:
  opmsa-demo:
    build: .
    ports:
      - "4112:4111"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SUPABASE_ACCESS_TOKEN=${SUPABASE_ACCESS_TOKEN}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - dmit_network

networks:
  dmit_network:
    external: true